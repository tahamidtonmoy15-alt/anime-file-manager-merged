name: Build Anime Watching Tracker APK

on:
  push:
    branches: [main, master]
    paths:
      - 'anime-watching-tracker/**'
      - '.github/workflows/build-anime-watching-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Anime Watching Tracker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor dependencies
        working-directory: anime-watching-tracker
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: anime-watching-tracker
        run: npx cap add android
      - name: Add Android external-player bridge
        working-directory: anime-watching-tracker
        run: |
          PKG=android/app/src/main/java/com/hda/animewatchingtracker
          mkdir -p "$PKG" android/app/src/main/res/xml
          cp android-overlay/ExternalPlayerPlugin.java android-overlay/MainActivity.java "$PKG/"
          cp android-overlay/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 android-overlay/add_provider.py
          grep -q 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml
      - name: Sync Capacitor
        working-directory: anime-watching-tracker
        run: npx cap sync android
      - name: Check application JavaScript syntax
        working-directory: anime-watching-tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No application script was found")
          Path("/tmp/anime-watching-tracker.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/anime-watching-tracker.js
      - name: Build debug APK
        working-directory: anime-watching-tracker/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp anime-watching-tracker/android/app/build/outputs/apk/debug/app-debug.apk anime-watching-tracker/Anime-Watching-Tracker.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-watching-tracker-apk
          path: anime-watching-tracker/Anime-Watching-Tracker.apk
          if-no-files-found: error
          retention-days: 30
